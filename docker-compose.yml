name: onf-to

networks:
  coolify:
    external: true

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: onf-to
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - coolify
    labels:
      - traefik.enable=true
      # onf.to is DNS-only at Cloudflare (Let's Encrypt needs it), so there is no
      # proxy in front to upgrade plaintext for us -- the http router has to do
      # it itself. QR codes are opaque, so a scan of an http:// code would
      # otherwise resolve in cleartext and be MITM-rewritable.
      # Traefik serves HTTP-01 challenges from its internal acme-http@internal
      # router, which outranks this one, so cert renewal is unaffected.
      - traefik.http.middlewares.onf-to-https.redirectscheme.scheme=https
      - traefik.http.middlewares.onf-to-https.redirectscheme.permanent=true
      - traefik.http.routers.onf-to-http.rule=Host(`onf.to`)
      - traefik.http.routers.onf-to-http.entrypoints=http
      - traefik.http.routers.onf-to-http.middlewares=onf-to-https
      - traefik.http.routers.onf-to-http.service=onf-to
      - traefik.http.routers.onf-to-http.priority=1
      - traefik.http.routers.onf-to-https.rule=Host(`onf.to`)
      - traefik.http.routers.onf-to-https.entrypoints=https
      - traefik.http.routers.onf-to-https.tls=true
      - traefik.http.routers.onf-to-https.tls.certresolver=letsencrypt
      - traefik.http.routers.onf-to-https.service=onf-to
      - traefik.http.services.onf-to.loadbalancer.server.port=3000
      - traefik.docker.network=coolify
